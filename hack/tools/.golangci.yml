version: "2"

run:
  timeout: 15m

linters:
  default: none
  enable:
    # default golangci-lint lints
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # additional lints
    - gochecknoinits
    - misspell
    - unparam
  exclusions:
    generated: lax
    rules:
      - path: pkg/testers/(ginkgo|node)/package\.go
        linters:
          - errcheck
        text: "Error return value of `gzf.Close` is not checked"
  settings:
    errcheck:
      exclude-functions:
        - os.RemoveAll
        - os.Setenv
        - os.Unsetenv
        - "(*os.File).Close"
        - "(*gzip.Reader).Close"
    staticcheck:
      checks:
        - all
        - -QF1006
        - -QF1008
        - -ST1000
        - -ST1005
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

formatters:
  enable:
    - gofmt
